plugins {
    id 'com.android.application'
}

// NOTE: greenDAO's Gradle plugin is not compatible with Gradle 8 (it still uses the removed
// IncrementalTaskInputs API). The DAO classes generated from the @Entity models are checked in
// under app/src/main/java/net/kaaass/zerotierfix/model/ instead. If you change or add an entity,
// regenerate them with greenDAO 3.3.0 on Gradle 7.x (schema version 22).

// 固定签名用的 keystore（提交在仓库里，便于每次构建都能覆盖安装）。
// 未提供时退回 AGP 默认 debug 签名，且 CI 不会发布未签名的 release 包。
def signingKeystore = rootProject.file('keystore/zerotierfix.jks')
if (!signingKeystore.exists()) {
    signingKeystore = rootProject.file('keystore/zerotierfix.p12')
}
def hasSigningKeystore = signingKeystore.exists()

android {
    namespace 'net.kaaass.zerotierfix'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "net.kaaass.zerotierfix"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 20
        versionName "2.1.1"
        multiDexEnabled true

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        if (hasSigningKeystore) {
            fixed {
                storeFile signingKeystore
                storePassword project.findProperty('ZT_STORE_PASSWORD') ?: 'android'
                keyAlias project.findProperty('ZT_KEY_ALIAS') ?: 'androiddebugkey'
                keyPassword project.findProperty('ZT_KEY_PASSWORD') ?: 'android'
            }
        }
    }

    buildTypes {
        debug {
            if (hasSigningKeystore) {
                signingConfig signingConfigs.fixed
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigningKeystore) {
                signingConfig signingConfigs.fixed
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }

    configurations {
        all {
            exclude module: 'httpclient'
            exclude module: 'commons-logging'
        }
    }
}

dependencies {
    implementation project(':core')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.activity:activity:1.9.3'

    implementation 'commons-io:commons-io:2.16.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.3'

    implementation 'org.greenrobot:greendao:3.3.0'
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'commons-validator:commons-validator:1.10.1'
    implementation 'androidx.multidex:multidex:2.0.1'

    //noinspection AnnotationProcessorOnCompilePath
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
